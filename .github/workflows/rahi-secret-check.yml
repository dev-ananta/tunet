name: Rahi secret check

on:
  workflow_dispatch:
  push:
    paths:
      - "api/rahi-assistant.js"
      - ".github/workflows/rahi-secret-check.yml"

jobs:
  check-rahi-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm Rahi API key secret exists
        env:
          RAHI_API_KEY: ${{ secrets.RAHI_API_KEY }}
        run: |
          if [ -z "$RAHI_API_KEY" ]; then
            echo "RAHI_API_KEY GitHub Secret is not set. Rahi will stay hidden until a server environment includes it."
            exit 1
          fi
          echo "RAHI_API_KEY GitHub Secret is configured."
